<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Form 예제</title>
</head>
<body>

<form>
    이름 :
    <input type="text" id="name">
    <input type="button" value="확인" onclick="showResult()">
</form>

<p id="result"></p>

<script>
    function showResult() {
        let name = document.getElementById("name").value;
        document.getElementById("result").innerHTML
            = "입력한 이름 : " + name;
    }
</script>

</body>
</html>
